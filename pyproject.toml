[project]
name = "sanjeevani-clinic"
version = "1.1.0"
description = "FastAPI healthcare assistance application with role-protected FastMCP tools"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "numpy",
    "scikit-learn",
    "fastapi",
    "uvicorn",
    "jinja2",
    "python-multipart",
    "nltk",
    "gensim",
    "groq",
    "python-dotenv",
    "bcrypt",
    "mysql-connector-python",
    "cashfree-pg",
    "itsdangerous",
    "requests",
    "fastmcp>=2.14.5,<3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
